# Look & feel of the app. Warm paper background, dark ink text, one orange accent.
[theme]
base = "light"
primaryColor = "#c2410c"
backgroundColor = "#f8f5ef"
secondaryBackgroundColor = "#efeadf"
textColor = "#22261f"
borderColor = "#d9d2c3"
baseRadius = "6px"
showWidgetBorder = true
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
chartCategoricalColors = ["#c2410c", "#2f6f6a", "#b8860b", "#5b5f97", "#8a4b5c", "#4f7a28"]

[theme.sidebar]
backgroundColor = "#22261f"
secondaryBackgroundColor = "#31362d"
textColor = "#f1ece0"
borderColor = "#434839"

[server]
maxUploadSize = 1000
