paths:
  weights_dir: "weights"
  uploads_dir: "data/uploads"
  outputs_dir: "outputs"
  metrics_dir: "outputs/metrics"
  tracks_dir: "outputs/tracks"
  videos_dir: "outputs/videos"
  plots_dir: "outputs/plots"

modes:
  fast:
    weights: "weights/yolov8n.pt"
    imgsz: 640
    conf: 0.25
    detect_every_n_frames: 3
  robust:
    weights: "weights/yolov8s.pt"
    imgsz: 1280
    conf: 0.20
    detect_every_n_frames: 1

# Optional class filter IDs. Leave empty [] for no filter (detect all classes)
classes: []

features:
  downscale_flow_width: 320

selector:
  # Who decides FAST vs ROBUST in ADAPTIVE mode: "forest" (random forest), "tree" (decision
  # tree) or "rules" (hand-set thresholds below, the baseline). A learned selector that has
  # not been trained yet falls back to rules. Train with: python -m src.training.train_selector
  type: "forest"
  models:
    tree: "weights/selector_tree.joblib"
    forest: "weights/selector_forest.joblib"
  decide_every: 3                 # ask the learned model every N frames (features still update every frame)
  threshold: 0.5                  # learned models: go ROBUST when P(ROBUST needed) >= this. Higher = less compute, fewer targets caught
  rule_thresholds:
    blur_threshold: 100.0         # Below this variance of Laplacian -> scene blurry -> push to ROBUST
    area_ratio_threshold: 0.003   # Below this bbox/image area ratio -> tiny object -> push to ROBUST
    conf_threshold: 0.45          # Below this mean detection confidence -> uncertain -> push to ROBUST
    camera_motion_threshold: 3.5  # Above this mean optical flow magnitude -> fast camera -> push to ROBUST

hysteresis:
  min_mode_duration: 15
  persistence_frames: 5

tracking:
  tracker_type: "bytetrack.yaml"
  trail_length: 30
